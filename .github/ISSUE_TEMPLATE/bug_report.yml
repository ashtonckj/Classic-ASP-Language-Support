name: 🐛 Bug Report
description: Report a bug or unexpected behaviour in the Classic ASP extension
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Just the description below is enough to get started —
        everything else is optional, so add it only if it's easy to include.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you do, what happened, and what did you expect instead? A code snippet or screenshot helps a lot if you have one.
      placeholder: |
        e.g. Typed `<%` inside a <script> block and pressed Enter — expected it to indent
        the body, but instead it left the closing `}` unindented.
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: Extension Version (optional)
      description: Found in the Extensions panel in VS Code.
      placeholder: e.g. v0.6.0
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Anything else? (optional)
      description: Steps to reproduce, related issues, workarounds — whatever seems useful.
    validations:
      required: false
