name: ✨ Feature Request
description: Suggest a new feature or improvement for the Classic ASP extension
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        Got an idea to improve the extension? We'd love to hear it!

  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: What are you trying to do, and what's missing or frustrating right now? Include an example if you have one.
      placeholder: |
        e.g. Pressing F12 on a function call doesn't jump to its definition when the
        function lives in a different `.asp` file that's `#include`d.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Anything else? (optional)
      description: Alternatives you've tried, links to similar extensions, mockups — whatever helps explain it.
    validations:
      required: false
