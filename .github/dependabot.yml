version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major upgrades held back on purpose; revisit each when its tooling catches up:
    # typescript 7 (typescript-eslint support), eslint 10 (typescript-eslint support),
    # @types/node (match the Node that VS Code runs).
    # @types/vscode stays at engines.vscode: vsce refuses to package when the
    # types are newer, and newer types would let code use APIs 1.80 lacks.
    ignore:
      - dependency-name: "@types/vscode"
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
